name: publish

# Tag a release to publish it:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Uses PyPI Trusted Publishing (OIDC), so there is no API token to store or
# leak. Configure it once at https://pypi.org/manage/account/publishing/ with:
#   project: dietcode | owner: DevPatils | repo: dietCode | workflow: publish.yml
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the tag matches agent/__version__
        # A mismatch here publishes a version nobody can reproduce from the tag.
        run: |
          python - <<'PY'
          import os, re, pathlib, sys
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          source = pathlib.Path("agent/__init__.py").read_text()
          version = re.search(r'__version__ = "([^"]+)"', source).group(1)
          if tag != version:
              sys.exit(f"tag {tag!r} != agent.__version__ {version!r}")
          print(f"version {version} matches tag")
          PY

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          # Start from an empty dist/. A previously committed artifact would
          # otherwise be uploaded next to the new one, and PyPI rejects the
          # whole upload because that version already exists.
          rm -rf dist
          python -m build
          python -m twine check dist/*
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
